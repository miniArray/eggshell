[package]
name = "eggshell-spike-player"
version = "0.1.0"
edition = "2024"
publish = false

[features]
benchmark-work-counters = ["eggshell-spike-core/benchmark-work-counters"]

[dependencies]
eggshell-spike-core = { path = "../core" }
sdl2 = { version = "=0.38.0", default-features = false, features = ["use-pkgconfig"] }
png = "=0.17.16"
glow = "=0.16.0"
libc = "=0.2.191"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[build-dependencies]
cc = "1.2"
pkg-config = "=0.3.34"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
